<!DOCTYPE html>
<html>
<head>
    <title>Daisy Games Hub</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background: #121214; color: white; }
        .menu { width: 220px; background: #202024; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 2px solid #29292e; }
        h2 { color: #4af6c3; margin-top: 0; font-size: 20px; }
        button { background: #4af6c3; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; color: #121214; text-align: left; }
        button:hover { background: #3ce0b0; }
        iframe { flex-grow: 1; border: none; background: white; }
    </style>
</head>
<body>

    <!-- Sidebar menu panel -->
    <div class="menu">
        <h2>Arcade Menu</h2>
        <button onclick="document.getElementById('game-screen').src='dino.html'">🦖 Play Dino Game</button>
    </div>

    <!-- Main window showing the game -->
    <iframe id="game-screen" src="dino.html"></iframe>

</body>
</html>
