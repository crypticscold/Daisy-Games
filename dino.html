<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Chrome Dino Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            width: 1000px;
            height: 250px;
            border: 2px solid #535353;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            background-color: #ffffff;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Pulls the clean open-source chromium project repository build -->
    <iframe src="https://wayou.github.io/t-rex-runner/" scrolling="no"></iframe>
</div>

</body>
</html>
